<div class="card">
  <header class="card-header">
    <a class="card-header-title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </header>

  <div class="card-content">
    <div class="content">
      {{ post.content }}
    </div>
  </div>

  <footer class="card-footer">
    <p class="card-footer-item">Published: {{ post.date | date: "%b %-d, %Y" }}</p>
  </footer>
</div>
